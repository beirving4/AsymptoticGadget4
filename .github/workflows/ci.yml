name: Release validation

on:
  push:
    branches:
      - main
      - "release/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python helpers and release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-validation.txt

      - name: Run helper tests
        run: |
          python tools/test_build_release_manifest.py
          python examples/LOSS/test_derive_lagrangian_radii.py
          python tools/check_local_markdown_links.py
          cffconvert --validate
          sha256sum --check examples/LOSS/INPUTS.sha256

      - name: Check scripts and generated bytecode
        run: |
          bash -n tools/run_graphify.sh
          python -m py_compile \
            tools/build_release_manifest.py \
            tools/check_local_markdown_links.py \
            examples/LOSS/derive_lagrangian_radii.py \
            examples/LOSS-smoke/validate_outputs.py

  linux-smoke:
    name: Linux x86-64 build and MPI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install system and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libfftw3-dev \
            libgsl-dev \
            libhdf5-dev \
            libopenmpi-dev \
            openmpi-bin \
            zlib1g-dev
          python -m pip install --requirement requirements-validation.txt

      - name: Build the LOSS smoke configuration
        run: |
          make --jobs 2 \
            SYSTYPE=Generic-system-gcc \
            DIR=examples/LOSS-smoke \
            PYTHON=python3 \
            OPTIMIZE="-O2 -g -Wall -Wno-format-security" \
            HDF5_INCL="-I/usr/include/hdf5/serial" \
            HDF5_LIBS="-L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5 -lz" \
            GSL_LIBS="-lgsl -lgslcblas" \
            FFTW_LIBS="-lfftw3f"
          file examples/LOSS-smoke/Gadget4

      - name: Run simulation, FOF/SUBFIND, and tree assembly
        working-directory: examples/LOSS-smoke
        run: |
          mpirun --oversubscribe -np 2 ./Gadget4 param.txt
          mpirun --oversubscribe -np 2 ./Gadget4 param.txt 8 0
          python validate_outputs.py output | tee validation-summary.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-smoke-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            examples/LOSS-smoke/validation-summary.json
            examples/LOSS-smoke/output/*.txt
            examples/LOSS-smoke/output/*.log

  macos-build:
    name: macOS build (manual release check)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Record runner architecture
        run: |
          uname -a
          uname -m
          xcodebuild -version

      - name: Install Homebrew dependencies
        run: brew install open-mpi hdf5 gsl fftw

      - name: Build the LOSS smoke configuration
        run: |
          make --jobs 2 \
            SYSTYPE=Darwin-Homebrew \
            DIR=examples/LOSS-smoke \
            PYTHON=python3
          file examples/LOSS-smoke/Gadget4
